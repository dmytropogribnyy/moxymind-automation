name: Quality Automation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - ui
          - api

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Bootstrap and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve dependencies
        run: npm install --no-audit --no-fund

      - name: Format source
        run: npm run format

      - name: Quality checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Install Chromium
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'api' }}
        run: npx playwright install --with-deps chromium

      - name: Run selected suite
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}" in
            smoke) npm run test:smoke ;;
            ui) npm run test:ui ;;
            api) npm run test:api ;;
            *) npm run test:all ;;
          esac
        env:
          CI: true
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Commit formatting and dependency lock
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: apply formatting and lock dependencies"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload formatted source and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            .env.example
            .github
            .gitignore
            .prettierignore
            .prettierrc.json
            clients
            config
            docs
            fixtures
            pages
            schemas
            test-data
            tests
            utils
            CONTRIBUTING.md
            README.md
            SECURITY.md
            eslint.config.mjs
            package.json
            package-lock.json
            playwright.config.ts
            tsconfig.json
          include-hidden-files: true
          retention-days: 2

      - name: Upload Playwright report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## Quality Automation Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | \`${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | \`${{ job.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright HTML reports and failure evidence are retained as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
