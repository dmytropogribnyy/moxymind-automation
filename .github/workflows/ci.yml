name: Quality Automation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - ui
          - api

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Quality checks and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Install Chromium
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'api' }}
        run: npx playwright install --with-deps chromium

      - name: Run selected suite
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}" in
            smoke) npm run test:smoke ;;
            ui) npm run test:ui ;;
            api) npm run test:api ;;
            *) npm run test:all ;;
          esac
        env:
          CI: true
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Upload Playwright report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## Quality Automation Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | \`${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | \`${{ job.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 [Download HTML report](${{ steps.upload-report.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Failure traces, screenshots, videos, and API timing attachments are retained with the run when available." >> "$GITHUB_STEP_SUMMARY"
